name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Placeholder values so `prisma generate` and `next build` don't crash on
      # missing-env guards. No real database/service connection is made here —
      # tests mock Prisma/Stripe/Resend, and `next build` never executes a query.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3002"
      AUTH_SECRET: "ci-placeholder-secret"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
